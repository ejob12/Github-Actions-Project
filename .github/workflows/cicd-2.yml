name: CI/CD Pipeline(3)

on:
  push:
    branches:
      - main

jobs:

###############################################################################
# 1. COMPILE
###############################################################################
  compile:
    name: Compile Application
    runs-on: self-hosted

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile Project
        run: mvn clean compile

###############################################################################
# 2. TRIVY FILESYSTEM SCAN (Secrets + Misconfiguration ONLY)
###############################################################################
  trivy_fs_scan:
    name: Trivy Filesystem Scan
    runs-on: self-hosted
    needs: compile

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          format: table
          output: trivy-fs-report.txt

      - name: Upload Trivy FS Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-report
          path: trivy-fs-report.txt

###############################################################################
# 3. GITLEAKS
###############################################################################
  gitleaks_scan:
    name: Gitleaks Secret Scan
    runs-on: self-hosted
    needs: trivy_fs_scan

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

###############################################################################
# 4. UNIT TESTS
###############################################################################
  test:
    name: Maven Unit Tests
    runs-on: self-hosted
    needs: gitleaks_scan

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Unit Tests
        run: mvn test

###############################################################################
# 5. PACKAGE APPLICATION
###############################################################################
  package:
    name: Package Application
    runs-on: self-hosted
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package Application
        run: mvn clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

###############################################################################
# 6. SONARQUBE ANALYSIS
###############################################################################
  sonarqube:
    name: SonarQube Analysis
    runs-on: self-hosted
    needs: package

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

###############################################################################
# 7. BUILD DOCKER IMAGE
###############################################################################
  docker_build:
    name: Build Docker Image
    runs-on: self-hosted
    needs: sonarqube

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: app

      - name: Build Docker Image
        run: |
          docker build -t adijaiswal/bankapp:latest .

###############################################################################
# 8. TRIVY IMAGE SCAN
###############################################################################
  trivy_image_scan:
    name: Trivy Docker Image Scan
    runs-on: self-hosted
    needs: docker_build

    steps:
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: adijaiswal/bankapp:latest
          format: table
          output: trivy-image-report.txt

      - name: Upload Image Scan Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.txt

###############################################################################
# 9. PUSH IMAGE TO DOCKER HUB
###############################################################################
  docker_push:
    name: Push Docker Image
    runs-on: self-hosted
    needs: trivy_image_scan

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        run: |
          docker push adijaiswal/bankapp:latest

###############################################################################
# 10. KUBERNETES DEPLOYMENT (DISABLED)
###############################################################################

